[project]
name = "weekly-newsletter-digest"
version = "2.0.0"
description = "Standalone weekly meta-newsletter digest: Gmail + Reeder -> Claude (OpenRouter) -> PDF"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "trafilatura>=1.6",
    "reportlab>=4.0",
    "requests>=2.28",
]

[project.scripts]
weekly-digest = "weekly_digest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weekly_digest"]
